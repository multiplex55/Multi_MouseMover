
# Key bindings map keyboard keys to actions
key_bindings = [
    ["A", "move_left"],
    ["D", "move_right"],
    ["L", "right_click"],
    ["LeftShift", "slow_mouse"],
    ["RightShift", "slow_mouse"],
    ["S", "move_down"],
    ["SPACE", "left_click"],
    ["N", "toggle_drag_mode"],
    ["F", "jump_mode"],
    ["W", "move_up"],
    [";", "middle_click"],
    [",", "wheel_up"],
    ["M", "wheel_down"],
    ["I", "wheel_left"],
    ["O", "wheel_right"],
    ["H", "center_current_monitor"],
    [".", "click_then_disable"],
    ["RightAlt+W", "move_to_top_edge"],
    ["RightAlt+A", "move_to_left_edge"],
    ["RightAlt+S", "move_to_bottom_edge"],
    ["RightAlt+D", "move_to_right_edge"],
    ["V", "wheel_speed_up"],
    ["B", "wheel_speed_down"],
    ["C", "mouse_speed_up"],
    ["X", "mouse_speed_down"],
    ["Z", "mouse_speed_reset"]
]

[system_bindings]
toggle_active = "Ctrl+E"
exit = "Escape"

polling_rate = 8

# Grid size
grid_size = {width = 10, height = 10}

[jump]
mode = "precision"
cursor_between_stages = "none"
start_region = "virtual_screen"
preview_edge_behavior = "clamp"

[jump.visuals]
selected_region_outline = true
preview_outline = true
active_grid_outline = true
cell_centers = false
final_crosshair = true

# Jump geometry uses four explicit regions:
# - session_region: the authoritative region tracked by the jump session.
# - target_region: the selectable region the current grid maps to.
# - preview_source_region: the captured screen region rendered behind the overlay.
# - client_draw_region: overlay window/client pixels used for drawing.
#
# target_margin_percent expands the selectable target for the next stage.
# visual_context_margin_percent expands only the preview source. With
# target_margin_percent = 0 and visual_context_margin_percent = 5, the overlay
# shows 5% surrounding context without making that context selectable.
#
# Deprecated alias: preview_margin_percent is accepted during the compatibility
# window and maps to visual_context_margin_percent only when that new field is
# absent. Prefer visual_context_margin_percent in all new stage configs.
[jump.coarse]
enabled = true
width = 10
height = 10
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_margin_percent = 0
visual_context_margin_percent = 0
zoom_scale = 1.0
target_region_mode = "exact_region"

[jump.coarse.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

[jump.fine]
enabled = true
width = 8
height = 8
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_margin_percent = 0
visual_context_margin_percent = 1
zoom_scale = 1.5
target_region_mode = "exact_region"

[jump.fine.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

[jump.precise]
enabled = true
width = 5
height = 5
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_margin_percent = 0
visual_context_margin_percent = 5
zoom_scale = 2.5
target_region_mode = "exact_region"

[jump.precise.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

[final_adjust]
enabled = false
small_step_px = 1
large_step_px = 10
modifier_key = "Shift"
confirm_key = "Enter"
cancel_key = "Escape"
back_key = "Backspace"

# Mouse movement parameters
acceleration      = 2 # Pixels per acceleration step
acceleration_rate = 1 # Polling cycles before applying acceleration
starting_speed    = 1 # Initial speed in pixels
top_speed         = 6

[mouse_speed]
default_speed = 1
min_speed = 1
max_speed = 12
speed_step = 1
flash_indicator_ms = 700

[wheel]
default_speed = 3
min_speed = 1
max_speed = 12
speed_step = 1
tick_interval = 8
speed_indicator_ms = 700

[edge_jump]
offset_px = 1
use_work_area = false

