
# Key bindings map keyboard keys to actions
key_bindings = [
    ["A", "move_left"],
    ["D", "move_right"],
    ["Escape", "exit"],
    ["L", "right_click"],
    ["LeftShift", "slow_mouse"],
    ["RightShift", "slow_mouse"],
    ["S", "move_down"],
    ["SPACE", "left_click"],
    ["F", "jump_mode"],
    ["W", "move_up"]
]

[system_bindings]
toggle_active = "Ctrl+E"
exit = "Escape"

polling_rate = 8

# Grid size
grid_size = {width = 10, height = 10}

[jump]
mode = "single"
move_cursor_after_each_stage = false

[jump.coarse]
enabled = true
width = 10
height = 10
preview_margin_percent = 0

[jump.fine]
enabled = false
width = 5
height = 5
preview_margin_percent = 10

[jump.precise]
enabled = false
width = 3
height = 3
preview_margin_percent = 5

# Mouse movement parameters
acceleration      = 2 # Pixels per acceleration step
acceleration_rate = 1 # Polling cycles before applying acceleration
starting_speed    = 1 # Initial speed in pixels
top_speed         = 6

