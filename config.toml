# Multi MouseMover configuration
#
# Canonical config reference: docs/config.md
#
# Key names are parsed by src/keyboard.rs and chords use "+" between modifiers
# and keys, for example "RightAlt+R". Use "/" for the main Slash key in
# user-facing bindings; "Slash" and "FORWARD_SLASH" are accepted aliases.
# Action names are parsed by src/action.rs.

# ---------------------------------------------------------------------------
# Root runtime settings
# ---------------------------------------------------------------------------
# polling_rate controls the main input loop delay in milliseconds.
polling_rate = 8

# Held movement starts at starting_speed, then adds acceleration every
# acceleration_rate polling cycles until it reaches top_speed.
starting_speed = 1
acceleration = 2
acceleration_rate = 1
top_speed = 6

# ---------------------------------------------------------------------------
# Key and system bindings
# ---------------------------------------------------------------------------
# These action bindings are handled only while active mode is enabled.
# Chord support today (current phase):
# - Supported: Alt+E, Ctrl+E, Shift+E, RightAlt+E,
#   standalone LeftShift, RightShift, LeftAlt, RightAlt.
# - Not yet supported in side-specific chord form (until side-aware chord model lands):
#   LeftAlt+E, LeftShift+E, RightShift+E, LeftCtrl+E, RightCtrl+E.
# Default movement/click layout: E/S/D/F for movement, J/K/L for clicks, N for drag toggle, and . for click_then_disable.
key_bindings = [
    ["E", "move_up"],
    ["S", "move_left"],
    ["D", "move_down"],
    ["F", "move_right"],
    ["LeftShift", "slow_mouse"],
    # ["LeftAlt", "scroll_modifier"],  # Optional: only needed when [scroll_mode].enabled = true
    ["Z", "surgical_mode"],

    ["J", "left_click"],
    ["K", "right_click"],
    ["L", "middle_click"],
    ["N", "toggle_drag_mode"],
    [".", "click_then_disable"],

    # Wheel directions (horizontal wheel bindings are commented out by preference).
# Optional actions/examples (uncomment as needed; all action strings are valid):
# ["I", "wheel_left"]
# ["O", "wheel_right"]
# ["Z", "mouse_speed_reset"]
# ["RightAlt+F", "jump_mode_profile:precise"]
# ["RightAlt+3", "jump_mode_profile.window"]
# ["RightAlt+1", "movement_profile:precision"]
# ["RightAlt+2", "wheel_profile:fast"]
# ["Backspace+1", "clear_bookmark_1"]
    ["W", "wheel_up"],
    ["R", "wheel_down"],
    # ["I", "wheel_left"],
    # ["O", "wheel_right"],


    #["Z", "mouse_speed_reset"],
    ["M", "mouse_speed_down"],
    [",", "mouse_speed_up"],

    # Wheel speed controls.
    ["U", "wheel_speed_down"],
    ["I", "wheel_speed_up"],
    ["RightAlt+C", "movement_profile_next"],
    ["RightAlt+X", "movement_profile_previous"],
    ["RightAlt+V", "wheel_profile_next"],
    ["RightAlt+B", "wheel_profile_previous"],

    ["T", "jump_mode"],
    ["G", "grid_mode"],
    ["C", "screen_select"],
    ["H", "navigate_back"],
    ["Y", "navigate_forward"],
    ["Q", "disable"],
    ["P", "disable"],
    ["RightAlt+E", "move_to_top_edge"],
    ["RightAlt+S", "move_to_left_edge"],
    ["RightAlt+D", "move_to_bottom_edge"],
    ["RightAlt+F", "move_to_right_edge"],
    ["RightAlt+Ctrl+E", "move_to_window_top_edge"],
    ["RightAlt+Ctrl+S", "move_to_window_left_edge"],
    ["RightAlt+Ctrl+D", "move_to_window_bottom_edge"],
    ["RightAlt+Ctrl+F", "move_to_window_right_edge"],
    ["RightAlt+Ctrl+H", "move_to_window_center"],
    ["RightAlt+Ctrl+Y", "move_to_window_titlebar"],

    ["RightAlt+R", "reload_config"],
    ["RightAlt+Escape", "panic_reset"],
    ["Alt+E", "step_move_up"],
    ["Alt+S", "step_move_left"],
    ["Alt+D", "step_move_down"],
    ["Alt+F", "step_move_right"],
    ["Alt+Ctrl+E", "step_move_small_up"],
    ["Alt+Ctrl+S", "step_move_small_left"],
    ["Alt+Ctrl+D", "step_move_small_down"],
    ["Alt+Ctrl+F", "step_move_small_right"],
    ["Alt+Shift+E", "step_move_large_up"],
    ["Alt+Shift+S", "step_move_large_left"],
    ["Alt+Shift+D", "step_move_large_down"],
    ["Alt+Shift+F", "step_move_large_right"],
    ["/", "show_help"],
    ["RightAlt+/", "keybind_lookup_mode"],
    ["0", "ui_hint_mode"],
    ["B", "bookmark_mode"],
    ["1", "bookmark_slot_1"],
    ["2", "bookmark_slot_2"],
    ["3", "bookmark_slot_3"],
    ["4", "bookmark_slot_4"],
    ["5", "bookmark_slot_5"],
    ["6", "bookmark_slot_6"],
    ["7", "bookmark_slot_7"],
    ["8", "bookmark_slot_8"],
    ["9", "bookmark_slot_9"],
    ["`", "show_bookmarks"],

]

# Input ownership/reconciliation controls.
[input]
swallow_owned_modifiers = true
# Stuck-modifier recovery only: periodically checks held modifiers
# (Alt, Ctrl, Shift, Win) and does not reconcile normal movement keys.
modifier_reconcile_on_tick = true
# How often the app is allowed to check held modifiers.
modifier_reconcile_interval_ms = 50
# How long a modifier must appear physically released before a synthetic
# key-up is sent. Panic reset ignores both timing settings and clears
# held/synthetic state immediately.
stuck_key_timeout_ms = 10000
debug_input = false
shift_can_modify_plain_movement = true

[ui_hints]
enabled = true
debug = false
debug_fake_targets = false
selection_keys = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
label_length = 2
overflow_behavior = "increase_length"
max_hints = 400
min_hint_spacing_px = 32
include_thread_windows = true
include_owned_popups = true
query_strategy = "descendants"
min_targets_before_fallback = 8
query_timeout_ms = 1200
target_point = "clickable_point"
after_select = "move"
repeat_click_window_ms = 350
# Optional post-select modifiers (exact modifier state match).
# [ui_hints.left_click_modifier]
# shift = true
# [ui_hints.right_click_modifier]
# ctrl = true
# [ui_hints.middle_click_modifier]
# alt = true
# [ui_hints.browse_modifier]
# right_alt = true

[ui_hints.overlay]
font_scale = 1.0

# These bindings remain available in both active and idle mode.
[system_bindings]
toggle_active = "Ctrl+Q"
exit = "Ctrl+Escape"
exit_ignore_extra_modifiers = true
panic_reset = "RightAlt+Escape"
panic_reset_ignore_extra_modifiers = true
panic_reset_sets_idle = true

# ---------------------------------------------------------------------------
# Movement speed and profiles
# ---------------------------------------------------------------------------
[mouse_speed]
default_speed = 1
min_speed = 1
max_speed = 12
speed_step = 1
flash_indicator_ms = 700

# Slow mode is a temporary precision tier triggered by the `slow_mouse` action
# (LeftShift in this sample config). It is independent from normal [mouse_speed]:
# [mouse_speed] controls your baseline movement tier, while [slow_mouse] controls
# only the held slow-mode tier.
#
# Strategy reference:
# - fixed:      use fixed_speed directly (most predictable; recommended default)
# - multiplier: scale current normal speed by multiplier
# - subtract:   reduce current normal speed by subtract_speed
#
# Recommended defaults for most users:
# strategy = "fixed", fixed_speed = 1, min_speed = 1, max_speed = 2,
# acceleration = 0, acceleration_rate = 1
#
# Optional preset snippets:
# Precision-focused preset (high control, no ramp):
# [slow_mouse]
# strategy = "fixed"
# fixed_speed = 1
# min_speed = 1
# max_speed = 2
# acceleration = 0
# acceleration_rate = 1
#
# Scaled slow mode preset (tracks current normal speed):
# [slow_mouse]
# strategy = "multiplier"
# multiplier = 0.35
# min_speed = 1
# max_speed = 4
# acceleration = 0
# acceleration_rate = 1
[slow_mouse]
strategy = "fixed" # fixed | multiplier | subtract
fixed_speed = 1
multiplier = 0.25
subtract_speed = 4
min_speed = 1
max_speed = 2
acceleration = 0
acceleration_rate = 1

# Preset examples. Cycle them with RightAlt+C / RightAlt+X or bind
# movement_profile:<name> directly.
[movement_profiles.fast]
default_speed = 5
min_speed = 2
max_speed = 18
speed_step = 2
flash_indicator_ms = 700

[movement_profiles.precise]
default_speed = 1
min_speed = 1
max_speed = 4
speed_step = 1
flash_indicator_ms = 700

[movement_profiles.window]
default_speed = 3
min_speed = 1
max_speed = 10
speed_step = 1
flash_indicator_ms = 700


# ---------------------------------------------------------------------------
# Scroll mode
# ---------------------------------------------------------------------------
[scroll_mode]
# Scroll mode is disabled by default.
enabled = false
# Optional binding: modifier_action only needs a bound key when scroll mode is enabled.
modifier_action = "scroll_modifier"
# If true, click actions release the modifier for predictable one-shot scrolling.
exit_on_click = true
# Reserved/experimental toggles (parsed but currently not enforced at runtime).
exclusive_with_jump_mode = true
exclusive_with_grid_mode = true
exclusive_with_ui_hint_mode = true

# ---------------------------------------------------------------------------
# Grid mode
# ---------------------------------------------------------------------------
[grid_mode]
enabled = true
start_region = "current_monitor"
width_percent = 1.0
height_percent = 1.0
center_on_cursor = true
min_width_px = 80
min_height_px = 80
move_cursor_each_step = true
line_visible = true
show_direction_labels = true

# ---------------------------------------------------------------------------
# Click bindings
# ---------------------------------------------------------------------------
# Click actions are bound above:
# - J: left_click
# - K: right_click
# - L: middle_click
# - N: toggle_drag_mode
# - .: click_then_disable

# ---------------------------------------------------------------------------
# Wheel speed and profiles
# ---------------------------------------------------------------------------
[wheel]
# Wheel level semantics:
# - level 1 is roughly one wheel notch/event in many apps.
# - higher levels increase per-event scroll distance (up to max_speed).
# - level 10 is intentionally high and often page-like, depending on app behavior.
default_speed = 1
min_speed = 1
max_speed = 10
speed_step = 1
# tick_interval controls held-key repeat cadence for wheel actions (milliseconds).
tick_interval = 120
speed_indicator_ms = 700
vertical_multiplier = 1
horizontal_multiplier = 1

# Preset examples. Cycle them with RightAlt+V / RightAlt+B or bind
# wheel_profile:<name> directly.
[wheel_profiles.precise]
default_speed = 1
min_speed = 1
max_speed = 4
speed_step = 1
tick_interval = 180
speed_indicator_ms = 700
vertical_multiplier = 1
horizontal_multiplier = 1

[wheel_profiles.normal]
default_speed = 1
min_speed = 1
max_speed = 10
speed_step = 1
tick_interval = 120
speed_indicator_ms = 700
vertical_multiplier = 1
horizontal_multiplier = 1

[wheel_profiles.fast]
default_speed = 3
min_speed = 1
max_speed = 10
speed_step = 1
tick_interval = 80
speed_indicator_ms = 700
vertical_multiplier = 1
horizontal_multiplier = 1

[wheel_profiles.page]
default_speed = 10
min_speed = 4
max_speed = 10
speed_step = 1
tick_interval = 100
speed_indicator_ms = 700
vertical_multiplier = 1
horizontal_multiplier = 1

# ---------------------------------------------------------------------------
# Jump mode, stages, visuals, and labels
# ---------------------------------------------------------------------------
[jump]
mode = "precision"
cursor_between_stages = "none"
start_region = "current_monitor"
preview_edge_behavior = "clamp"

[jump.hints]
selection_keys = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"

# Overlay drawing flags for jump mode.
[jump.visuals]
selected_region_outline = true
preview_outline = true
active_grid_outline = true
cell_centers = false
final_crosshair = true

# Jump geometry uses four explicit regions:
# - session_region: the authoritative region tracked by the jump session.
# - target_region: the selectable region the current grid maps to.
# - preview_source_region: the captured screen region rendered behind the overlay.
# - client_draw_region: overlay window/client pixels used for drawing.
#
# target_margin_percent expands the selectable target for the next stage.
# visual_context_margin_percent expands only the preview source. With
# target_margin_percent = 0 and visual_context_margin_percent = 5, the overlay
# shows 5% surrounding context without making that context selectable.
# zoom_scale affects only the captured preview image size for opaque previews;
# it does not change the target grid math. Transparent-grid mode draws over the
# real desktop and ignores preview zoom/source shifting.
# preview_edge_behavior controls how opaque preview context behaves near screen
# edges. Stage-level values override the [jump] default.
#
# Deprecated alias: preview_margin_percent is accepted during the compatibility
# window and maps to visual_context_margin_percent only when that new field is
# absent. Prefer visual_context_margin_percent in all new stage configs.
[jump.coarse]
enabled = true
width = 10
height = 10
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_region_mode = "exact_region"
target_margin_percent = 0
visual_context_margin_percent = 0
zoom_scale = 1.0

[jump.coarse.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

[jump.fine]
enabled = true
width = 8
height = 8
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_region_mode = "exact_region"
target_margin_percent = 0
visual_context_margin_percent = 1
zoom_scale = 1.5

[jump.fine.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

[jump.precise]
enabled = false
width = 5
height = 5
aim_point = "center"
aim_offset_x_px = 0
aim_offset_y_px = 0
target_region_mode = "exact_region"
target_margin_percent = 0
visual_context_margin_percent = 5
zoom_scale = 2.5

[jump.precise.labels]
font_scale = 1.0
center_marker = false
separators = true
hide_threshold_px = 0

# ---------------------------------------------------------------------------
# Final adjust
# ---------------------------------------------------------------------------
# When enabled, completed jumps pause for keyboard nudging before committing.
[final_adjust]
enabled = false
small_step_px = 1
large_step_px = 10
modifier_key = "Shift"
confirm_key = "Enter"
cancel_key = "Escape"
back_key = "Backspace"
show_hint = true

[step_move]
enabled = true
small_step_px = 20
normal_step_px = 80
large_step_px = 240
clamp_mode = "virtual_screen" # none | virtual_screen | current_monitor | current_work_area
show_tooltip = true

# ---------------------------------------------------------------------------
# Overlays
# ---------------------------------------------------------------------------
# The status overlay is the compact live indicator for current runtime state.
[status_overlay]
visibility = "visible"
mode = "minimal"
positioning = "cursor"
flash_duration_ms = 700

[status_overlay.fields]
active = true
drag = true
slow = true
jump = true
surgical = true
mouse_speed = true
wheel_speed = true
flash = true
final_adjust = true
bookmark_mode = true

# The tooltip overlay is separate from the status indicator. It controls short
# explanatory messages and the larger help view opened from the help binding.
[tooltip_overlay]
enabled = true
show_temporary_tooltips = true
show_help = true
positioning = "cursor"
offset_x = 18
offset_y = 18
duration_ms = 900
help_positioning = "center"
help_width = 420
help_max_bindings = 40

[tooltip_overlay.mode_cards]
enabled = true
show_bookmark_mode = true
show_jump_mode = true
show_grid_mode = true
show_ui_hint_mode = true
show_final_adjust = true
duration_ms = 900

[tooltip_overlay.help]
interactive = true
page_size = 18
show_unbound_actions = true
show_conflicts = true
show_mode_specific_sections = true

[tooltip_overlay.events]
mouse = true
wheel = true
profile = true
drag = true
reload = true
panic = true
surgical = true
ui_hints_query_start = true
ui_hints_query_fail = true
ui_hints_query_empty = true
ui_hints_query_capped_count = false
bookmarks = true

# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------
[edge_jump]
offset_px = 1
use_work_area = false

[window_jump]
enabled = true
use_extended_frame_bounds = true
edge_offset_px = 1
titlebar_y_offset_px = 10
clamp_to_window = true

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# Jump profiles merge over [jump] for one launch.
[jump.profiles.fast]
mode = "single"
cursor_between_stages = "none"

[jump.profiles.fast.coarse]
enabled = true
width = 14
height = 10
visual_context_margin_percent = 0
zoom_scale = 1.0

[jump.profiles.precise]
mode = "precision"
cursor_between_stages = "preview_only"

[jump.profiles.precise.coarse]
enabled = true
width = 8
height = 6
visual_context_margin_percent = 0
zoom_scale = 1.0

[jump.profiles.precise.fine]
enabled = true
width = 6
height = 6
visual_context_margin_percent = 3
zoom_scale = 2.0

[jump.profiles.precise.precise]
enabled = true
width = 5
height = 5
visual_context_margin_percent = 8
zoom_scale = 3.0

[jump.profiles.window]
mode = "precision"
start_region = "active_window_bounds"
preview_edge_behavior = "shift_into_bounds"

[jump.profiles.window.coarse]
enabled = true
width = 8
height = 6
visual_context_margin_percent = 2
zoom_scale = 1.5

[jump.profiles.monitor]
mode = "precision"
start_region = "current_monitor"

[jump.profiles.monitor.coarse]
enabled = true
width = 10
height = 8
visual_context_margin_percent = 0
zoom_scale = 1.0

[bookmarks]
enabled = true
file = "bookmarks.json"
slot_count = 9
show_tooltips = true
prompt_for_name_on_set = true
prompt_for_name_on_save = true
allow_name_updates = true
name_prompt_timeout_ms = 5000
max_name_length = 48
desktop_behavior = "focus_anchor_window"
desktop_switch_wait_ms = 150
require_desktop_switch_success = false
cancel_key = "Escape"
clear_modifier_key = "Backspace"
coordinate_policy = "clamp_to_virtual_screen"
list_show_coordinates = true
list_include_empty_slots = true
list_empty_slot_label = "(empty)"
list_unnamed_label = "(unnamed)"
list_tooltip_duration_ms = 1200

[surgical_mode]
enabled = true
speed_px = 1
zoom_enabled = true
# Surgical zoom overlay is topmost, non-activating, and click-through.
zoom_scale = 2.0
zoom_size_px = 180
overlay_offset_x = 24
overlay_offset_y = 24
refresh_interval_ms = 16
center_crosshair = true
